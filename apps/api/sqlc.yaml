version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        # NUMERIC columns map to pgtype.Numeric; sqlc v1.31 ignores type
        # overrides for them, so conversions live next to the query call sites.
