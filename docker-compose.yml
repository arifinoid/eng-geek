services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: enggreek
      POSTGRES_PASSWORD: enggreek
      POSTGRES_DB: enggreek
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enggreek -d enggreek"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://enggreek:enggreek@db:5432/enggreek?sslmode=disable
      STATIC_DIR: /srv/out
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
