openapi: 3.1.0
info:
  title: eng-geek API
  version: 0.1.0
  description: Personalized English learning tracker. Two profiles, per-skill CEFR progress.
servers:
  - url: /api/v1
tags:
  - name: profiles
  - name: content
  - name: attempts
  - name: assessments
  - name: progress
paths:
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List profiles in the household
      parameters:
        - name: householdId
          in: query
          required: false
          description: Household id. Defaults to 1 for the single-household setup.
          schema:
            type: integer
            format: int64
            default: 1
      responses:
        "200":
          description: Profiles in the household
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/{profileId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get one profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
  /units:
    get:
      operationId: listUnits
      tags: [content]
      summary: List units for a profile
      parameters:
        - name: profileId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Units available to the profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
  /units/{unitId}/activities:
    get:
      operationId: listUnitActivities
      tags: [content]
      summary: List activities in a unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Activities in the unit, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
  /activities/{activityId}:
    get:
      operationId: getActivity
      tags: [content]
      summary: Get one activity with its content
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
  /profiles/{profileId}/dashboard:
    get:
      operationId: getDashboard
      tags: [profiles]
      summary: Dashboard for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: weeks
          in: query
          required: false
          description: Weekly study-minute buckets to return. Defaults to 8.
          schema:
            type: integer
            default: 8
      responses:
        "200":
          description: Streak, study time, skill ratings, and next activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "404":
          $ref: "#/components/responses/NotFound"
  /profiles/{profileId}/gate:
    get:
      operationId: getGate
      tags: [progress]
      summary: Level gate status for a profile
      description: >
        Reports completion, checkpoint and skill ratings for a level. Without the
        level query parameter it uses the profile's current level.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: level
          in: query
          required: false
          description: Level code such as A1. Defaults to the profile's current level.
          schema:
            type: string
      responses:
        "200":
          description: The gate result for the level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gate"
        "404":
          $ref: "#/components/responses/NotFound"
  /profiles/{profileId}/assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List a profile's assessments
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: Maximum number of assessments to return. Defaults to 20, capped at 100.
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Assessments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
        "404":
          $ref: "#/components/responses/NotFound"
  /assessments:
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Record a checkpoint or placement assessment
      description: >
        A checkpoint is stored in the same transaction as the level gate it
        triggers, so a level cannot be completed without the assessment that
        justified it. A placement only records the scores and reports the gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequest"
      responses:
        "201":
          description: The recorded assessment and the gate outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAssessmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /attempts:
    post:
      operationId: createAttempt
      tags: [attempts]
      summary: Record an activity attempt
      description: >
        One transaction: stores the attempt, locks the skill rating row,
        applies the Elo update, writes the rating event, and activates the
        level of the activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptRequest"
      responses:
        "201":
          description: The recorded attempt and its rating change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        track:
          type: string
          enum: [engineer, nurse]
        target_exam:
          type: string
          enum: [ielts, oet]
        exam_date:
          type: string
          format: date
          nullable: true
      required: [id, name, track, target_exam]
    Unit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        level_code:
          type: string
          example: A1
        track:
          type: string
          enum: [engineer, nurse]
          nullable: true
        title:
          type: string
        position:
          type: integer
      required: [id, level_code, title, position]
    Activity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        unit_id:
          type: integer
          format: int64
        type:
          type: string
          enum: [quiz, vocab, writing, speaking, listening]
        skill:
          type: string
          enum: [listening, reading, writing, speaking]
        difficulty:
          type: integer
        position:
          type: integer
        content:
          type: object
          additionalProperties: true
          description: One shape per type; see docs/content.md.
      required: [id, unit_id, type, skill, difficulty, position, content]
    AttemptRequest:
      type: object
      properties:
        profileId:
          type: integer
          format: int64
        activityId:
          type: integer
          format: int64
        score:
          type: number
          minimum: 0
          maximum: 1
        durationSec:
          type: integer
          minimum: 0
        feedback:
          nullable: true
          description: Raw JSON feedback, stored as written (AI feedback for writing and speaking).
      required: [profileId, activityId, score, durationSec]
    Attempt:
      type: object
      properties:
        id:
          type: integer
          format: int64
        profile_id:
          type: integer
          format: int64
        activity_id:
          type: integer
          format: int64
        score:
          type: number
        duration_sec:
          type: integer
        feedback:
          nullable: true
        skill:
          type: string
          enum: [listening, reading, writing, speaking]
        rating_before:
          type: number
        rating_after:
          type: number
        rating_delta:
          type: number
        created_at:
          type: string
          format: date-time
      required:
        - id
        - profile_id
        - activity_id
        - score
        - duration_sec
        - skill
        - rating_before
        - rating_after
        - rating_delta
        - created_at
    SkillRating:
      type: object
      properties:
        skill:
          type: string
          enum: [listening, reading, writing, speaking]
        rating:
          type: number
        level:
          type: string
          example: A1
        attempts_count:
          type: integer
      required: [skill, rating, level, attempts_count]
    WeeklyMinutes:
      type: object
      properties:
        week_start:
          type: string
          example: "2026-11-16"
        minutes:
          type: integer
      required: [week_start, minutes]
    NextActivity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        unit_id:
          type: integer
          format: int64
        unit_position:
          type: integer
        unit_title:
          type: string
        type:
          type: string
          enum: [quiz, vocab, writing, speaking, listening]
        skill:
          type: string
          enum: [listening, reading, writing, speaking]
        difficulty:
          type: integer
        position:
          type: integer
      required:
        - id
        - unit_id
        - unit_position
        - unit_title
        - type
        - skill
        - difficulty
        - position
    Dashboard:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        level:
          type: string
          example: A1
        streak_days:
          type: integer
        week_minutes:
          type: integer
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillRating"
        weekly_minutes:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyMinutes"
        next_activities:
          type: array
          items:
            $ref: "#/components/schemas/NextActivity"
      required:
        - profile
        - level
        - streak_days
        - week_minutes
        - skills
        - weekly_minutes
        - next_activities
    AssessmentScores:
      type: object
      properties:
        listening:
          type: number
          minimum: 0
          maximum: 1
        reading:
          type: number
          minimum: 0
          maximum: 1
        writing:
          type: number
          minimum: 0
          maximum: 1
        speaking:
          type: number
          minimum: 0
          maximum: 1
      required: [listening, reading, writing, speaking]
    AssessmentRequest:
      type: object
      properties:
        profileId:
          type: integer
          format: int64
        levelCode:
          type: string
          example: A1
        kind:
          type: string
          enum: [checkpoint, placement]
        scores:
          $ref: "#/components/schemas/AssessmentScores"
      required: [profileId, levelCode, kind, scores]
    Assessment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        profile_id:
          type: integer
          format: int64
        level_code:
          type: string
          example: A1
        kind:
          type: string
          enum: [checkpoint, placement]
        scores:
          type: object
          additionalProperties: true
          description: The four skill scores as recorded.
        overall:
          type: number
        created_at:
          type: string
          format: date-time
      required:
        - id
        - profile_id
        - level_code
        - kind
        - scores
        - overall
        - created_at
    Gate:
      type: object
      properties:
        level:
          type: string
          example: A1
        passed:
          type: boolean
        reasons:
          type: array
          items:
            type: string
          description: Human-readable reasons the gate is not met; empty when it passes.
        completion_total:
          type: integer
        completion_done:
          type: integer
        completion_ratio:
          type: number
        checkpoint_overall:
          type: number
          nullable: true
          description: The latest checkpoint overall for the level, if any.
        min_skill:
          type: string
          enum: [listening, reading, writing, speaking]
        min_rating:
          type: number
        ratings:
          type: object
          additionalProperties:
            type: number
        next_level:
          type: string
          nullable: true
          description: The level after this one; null at C2.
      required:
        - level
        - passed
        - reasons
        - completion_total
        - completion_done
        - completion_ratio
        - checkpoint_overall
        - min_skill
        - min_rating
        - ratings
        - next_level
    CreateAssessmentResponse:
      type: object
      properties:
        assessment:
          $ref: "#/components/schemas/Assessment"
        gate:
          $ref: "#/components/schemas/Gate"
        level_completed:
          type: boolean
          description: Whether recording this checkpoint completed the level.
      required: [assessment, gate, level_completed]
